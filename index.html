<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1D1E" />
    <meta name="description" content="Suivi d’entraînement calisthénie personnel : logging de séance, progressions et statistiques." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Barre — suivi calisthénie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Applique le thème avant la première peinture : sans ça, un athlète en
      // thème clair verrait l'app s'afficher en sombre le temps que React
      // monte. Doit rester synchrone, sans module, et aligné sur
      // `src/hooks/useTheme.tsx`.
      (function () {
        try {
          var choice = localStorage.getItem('barre.theme.v1') || 'system'
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#1A1D1E' : '#F2EFE8')
        } catch (err) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
